<!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <title>Bezpieczny notatnik!</title>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <style>
        .hidden {display: none;}
    </style>
</head>
<body class="container">
    <div id="authSection" class="container loginPanel">
            <h2>Logowanie / Rejestracja</h2>
            <div class="field loginBox">
                <input class="form-control" type="text" id="login" placeholder="Twój login">
            </div>
            <div class="field loginBox">
                <input class="form-control" type="password" id="password" placeholder="Twoje hasło">
            </div>
                <div class="btn-group">
                    <button class="btn btn-success"onclick="login()">Zaloguj się</button>
                    <button class="btn btn-primary"onclick="register()">Zarejestruj się</button>
                </div>
            <div id="authStatus"></div>
    </div>

    <div id="appSection" style=>
        <button class="btn btn-danger" onclick="logout()">Wyloguj się</button>

        <h2>Wyślij bezpieczną notatkę</h2>
        <div class="field">
            <input class="form-control" type="text" id="toUser" placeholder="Login odbiorcy">
        </div>
        <div class="field">
            <div style="max-height: 300px;" id="editor"></div>
        </div>


        <div class="field" style="width: 220px;">
            <select class="form-select"id="ttl">
                <option selected>Czas Ważności Notatki</option>
                <option value="30">30 sekund</option> <!--Do testów-->
                <option value="3600">1 godzina</option>
                <option value="86400">24 godziny</option>
                <option value="604800">7 dni</option>
            </select>
        </div>


        <div class="field">
            <input type="checkbox" id="burnOnRead">Usunąć natychmiast po przeczytaniu (Burn on read)?
        </div>
        <button class="btn btn-success" onclick="sendNote()">Wyślij</button>
        <div id="sendStatus"></div>

        <h2>Sprawdź skrzynkę</h2>
        <button class="btn btn-warning" onclick="getNotes()">Pobierz wiadomości</button>
        <div id="messages"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script src="index.js"></script>
</body>
</html>
