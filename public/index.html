<!DOCTYPE html>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Usuwanie złośliwych tagów -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <title>Bezpieczny notatnik!</title>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="authSection">
        <h2>Logowanie / Rejestracja</h2>
        <div class="field">
            <input type="text" id="login" placeholder="Twój login">
        </div>
        <div class="field">
            <input type="password" id="password" placeholder="Twoje hasło">
        </div>
        <button onclick="login()">Zaloguj się</button>
        <button onclick="register()">Zarejestruj się</button>
        <div id="authStatus"></div>
    </div>

    <div id="appSection">
        <div>Zalogowano jako: <b id="username"></b></div>
        <button onclick="logout()">Wyloguj się</button>

        <h2>Wyślij bezpieczną notatkę</h2>
        <div class="field">
            <input type="text" id="toUser" placeholder="Login odbiorcy">
        </div>
        <div class="field">
            <div style="max-height: 300px;" id="editor"></div>
        </div>
        <div class="field">
            <label for="ttl">Czas ważności notatki:</label>
            <select id="ttl">
                <option value="-1">Nigdy</option>
                <option value="900">15 minut</option>
                <option value="3600">1 godzina</option>
                <option value="10800">3 godziny</option>
                <option value="28800">8 godzin</option>
                <option value="86400">1 dzień</option>
                <option value="259200">3 dni</option>
                <option value="604800">7 dni</option>
                <option value="2592000">30 dni</option>
            </select>
        </div>
        <div class="field">
            <input type="checkbox" id="burnOnRead">Usunąć natychmiast po przeczytaniu (Burn on read)?
        </div>
        <button onclick="sendNote()">Wyślij</button>
        <button onclick="saveNote()">Zapisz u siebie</button>
        <div id="sendStatus"></div>

        <h2>Sprawdź skrzynkę</h2>
        <button onclick="getNotes()">Pobierz wiadomości</button>
        <div id="messages"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script src="index.js"></script>
</body>
</html>
