<!DOCTYPE html>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- Usuwanie złośliwych tagów -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <title>Bezpieczny notatnik!</title>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="page-content">
    <div id="authSection" class="loginPanel">
            <h2>Logowanie / Rejestracja</h2>
            <div class="field loginBox">
                <input class="form-control" type="text" id="login" placeholder="Twój login">
            </div>
            <div class="field loginBox">
                <input class="form-control" type="password" id="password" placeholder="Twoje hasło">
            </div>
                <div class="btn-group">
                    <button class="btn btn-success"onclick="login()">Zaloguj się</button>
                    <button class="btn btn-primary"onclick="register()">Zarejestruj się</button>
                </div>
            <div id="authStatus"></div>
    </div>

    <div id="appSection">
        <div>Zalogowano jako: <b id="username"></b></div>
        <button class="btn btn-danger" onclick="logout()">Wyloguj się</button>

        <h2>Wyślij bezpieczną notatkę</h2>
        <div class="field">
            <input class="form-control" type="text" id="toUser" placeholder="Login odbiorcy">
        </div>
        <div class="field">
            <div style="max-height: 300px;" id="editor"></div>
        </div>


        <div class="field" style="width: 220px;">
            <label for="ttl">Kiedy automatycznie usunąć notatkę:</label>
            <select class="form-select" id="ttl">
                <option selected value="-1">Nigdy</option>
                <option value="900">Po 15 minutach</option>
                <option value="3600">Po 1 godzinie</option>
                <option value="10800">Po 3 godzinach</option>
                <option value="28800">Po 8 godzinach</option>
                <option value="86400">Po 1 dniu</option>
                <option value="259200">Po 3 dniach</option>
                <option value="604800">Po 7 dniach</option>
                <option value="2592000">Po 30 dniach</option>
            </select>
        </div>


        <div class="field">
            <input type="checkbox" id="burnOnRead">Usunąć natychmiast po przeczytaniu (Burn on read)?
        </div>
        <button class="btn btn-success"onclick="sendNote()">Wyślij</button>
        <button class="btn btn-primary"onclick="saveNote()">Zapisz u siebie</button>
        <div id="sendStatus"></div>

        <h2>Sprawdź skrzynkę</h2>
        <button class="btn btn-warning" onclick="getNotes()">Pobierz wiadomości</button>
        <div id="messages"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script src="index.js"></script>
    </div>
</body>
</html>
